<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaLike</title>
</head>
<body>
    <h1 style="display: flex; justify-content: center;">
        InstaLike 
    </h1>
    <div class="card">
        <figure style="margin: 0; border-radius: 50px; background-color: rgb(146, 203, 203);" >
            <img id="post-image" src="https://picsum.photos/300/200" alt="Sample Post Image" >
            <figcaption style="margin-top: 8px; color: #555; text-decoration-line: overline; text-size-adjust: 100;">A beautiful moment</figcaption>
        </figure>
        
        <button id="btn" class="like-btn" type="button">Like</button>
        <p><span id="like-count">0</span> likes</p>
    </div>
    <button id="btn" type="click">Like</button>
    <script src="like.js"></script>
</body>
</html>
