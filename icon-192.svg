    <ellipse cx="61" cy="108" rx="20" ry="15"/>
    <ellipse cx="105" cy="109" rx="18" ry="13"/>
  </g>
  <path d="M65 133h60" stroke="#a9c4ff" stroke-width="8" stroke-linecap="round"/>
  <text x="96" y="166" text-anchor="middle" font-family="Syne, Arial, sans-serif" font-size="20" font-weight="700" fill="#f5f7ff" letter-spacing="3">S</text>
</svg>
