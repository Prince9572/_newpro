<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192" role="img" aria-labelledby="title desc">
  <title id="title">STRATOS icon</title>
  <desc id="desc">Hexagonal weather app icon with a sun and cloud.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07071a"/>
      <stop offset="55%" stop-color="#132b59"/>
      <stop offset="100%" stop-color="#6c8ef5"/>
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="192" height="192" rx="44" fill="url(#bg)"/>
  <path d="M96 24l55 31.75v63.5L96 151 41 119.25v-63.5L96 24z" fill="none" stroke="#ffffff" stroke-opacity=".24" stroke-width="6"/>
  <circle cx="121" cy="70" r="22" fill="url(#sun)" filter="url(#glow)"/>
