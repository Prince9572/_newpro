version: '3.8'

services:
  # MySQL Transactional Database
  mysql:
    image: mysql:8.0
    container_name: omnirec-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: omnirecdb
      MYSQL_USER: omnirec_user
      MYSQL_PASSWORD: omnirec_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # MongoDB Catalog & Event Database
  mongodb:
    image: mongo:6.0
    container_name: omnirec-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # Redis Cache
  redis:
    image: redis:7.0-alpine
    container_name: omnirec-redis
    restart: always
    ports:
      - "6379:6379"

  # Python FastAPI Recommendation Engine
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: omnirec-ai-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - AI_SERVICE_HOST=0.0.0.0
      - AI_SERVICE_PORT=8000
      - SEED_DATA_PATH=/app/seed_data.json
    volumes:
      - ./seed_data.json:/app/seed_data.json

  # Java Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omnirec-backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - mongodb
      - redis
      - ai-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/omnirecdb?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=omnirec_user
      - SPRING_DATASOURCE_PASSWORD=omnirec_pass
      - AI_SERVICE_URL=http://ai-service:8000
      - SEED_DATA_PATH=/app/seed_data.json
    volumes:
      - ./seed_data.json:/app/seed_data.json

  # React Frontend (Nginx Served)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omnirec-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  mongo_data:
